[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-publisher"
version = "0.5.0"
description = "Batch-publish finished videos to Douyin Creator Platform via browser automation — scan a series folder, generate a manifest, upload & publish with human confirmation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["douyin", "tiktok", "batch-upload", "playwright", "automation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "playwright>=1.40",
]

[project.scripts]
douyin-publisher = "douyin_publisher.cli:main"

[project.urls]
Homepage = "https://github.com/TODO/douyin-publisher"

[tool.setuptools]
packages = ["douyin_publisher"]
